
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szalone Widelce Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfcfb;
        }
        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }
        .chalk-font {
            font-family: 'Dancing Script', cursive;
        }
        .zigzag-border {
            background-image: linear-gradient(135deg, #C32026 25%, transparent 25%), linear-gradient(225deg, #C32026 25%, transparent 25%), linear-gradient(45deg, #C32026 25%, transparent 25%), linear-gradient(315deg, #C32026 25%, transparent 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat-x;
            height: 10px;
        }
        .pattern-bg {
          background-color: #4A2C2A;
          background-image:  repeating-linear-gradient(45deg, #533331 25%, transparent 25%, transparent 75%, #533331 75%, #533331), repeating-linear-gradient(45deg, #533331 25%, #4A2C2A 25%, #4A2C2A 75%, #533331 75%, #533331);
          background-position: 0 0, 10px 10px;
          background-size: 20px 20px;
        }
        .chalkboard-texture {
            background-color: #1a1a1a;
            /* Zastąpiono zewnętrzną teksturę gradientem, aby uniknąć problemów z CORS przy eksporcie */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, transparent 100%),
                linear-gradient(rgba(26,26,26,1), rgba(20,20,20,1));
        }
    </style>
<script type="importmap">

  }
}
</script>

</head>
